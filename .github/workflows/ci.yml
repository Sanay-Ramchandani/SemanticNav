name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,viz]'
      - name: Test
        run: python -m pytest -q
      - name: Small seeded benchmark
        run: python -m semanticnav bench --episodes 6 --seed-start 9000 --output results/ci-smoke
