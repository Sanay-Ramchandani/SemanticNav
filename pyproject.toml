[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "semanticnav-research"
version = "0.1.0"
description = "Independent modular object-goal navigation research prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "Pillow>=9"]

[project.optional-dependencies]
viz = ["matplotlib>=3.6"]
dev = ["pytest>=7", "matplotlib>=3.6"]

[tool.setuptools.packages.find]
include=["semanticnav*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
